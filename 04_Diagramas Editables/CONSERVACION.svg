<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1090"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="black"/></marker></defs><rect x="75" y="20" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="66" font-family="Arial" font-size="32" fill="black">1. Institución pública comunica requerimiento o necesidad.</text><path d="M750,150 L750,184" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="190" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="236" font-family="Arial" font-size="32" fill="black">2. Conservación define alcance técnico y gestiona cotizaciones o</text><text x="105" y="272" font-family="Arial" font-size="32" fill="black">proveedores.</text><path d="M750,320 L750,354" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="360" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="406" font-family="Arial" font-size="32" fill="black">3. Cumplimiento revisa la contraparte o proveedor cuando corresponde.</text><path d="M750,490 L750,524" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="530" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="576" font-family="Arial" font-size="32" fill="black">4. Conservación formula recomendación técnica y coordina documentación</text><text x="105" y="612" font-family="Arial" font-size="32" fill="black">para pago.</text><path d="M750,660 L750,694" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="700" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="746" font-family="Arial" font-size="32" fill="black">5. Finanzas ejecuta el circuito de revisión y transferencia.</text><path d="M750,830 L750,864" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="870" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="916" font-family="Arial" font-size="32" fill="black">6. La institución recibe el bien, servicio o resultado; se conserva</text><text x="105" y="952" font-family="Arial" font-size="32" fill="black">evidencia de ejecución y gasto.</text></svg>