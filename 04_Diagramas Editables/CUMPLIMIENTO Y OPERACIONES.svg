<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1260"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="black"/></marker></defs><rect x="75" y="20" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="66" font-family="Arial" font-size="32" fill="black">1. Área solicitante identifica contraparte y necesidad de vinculación.</text><path d="M750,150 L750,184" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="190" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="236" font-family="Arial" font-size="32" fill="black">2. Se solicita formulario y documentación aplicable.</text><path d="M750,320 L750,354" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="360" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="406" font-family="Arial" font-size="32" fill="black">3. Revisor controla completitud, legibilidad y coherencia; solicita</text><text x="105" y="442" font-family="Arial" font-size="32" fill="black">información faltante.</text><path d="M750,490 L750,524" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="530" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="576" font-family="Arial" font-size="32" fill="black">4. Se realizan verificaciones de identidad, geografía, sanciones, listas</text><text x="105" y="612" font-family="Arial" font-size="32" fill="black">adicionales, PEP y noticias.</text><path d="M750,660 L750,694" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="700" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="746" font-family="Arial" font-size="32" fill="black">5. Las posibles coincidencias se escalan al Responsable de Cumplimiento</text><text x="105" y="782" font-family="Arial" font-size="32" fill="black">para resolución.</text><path d="M750,830 L750,864" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="870" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="916" font-family="Arial" font-size="32" fill="black">6. Se documentan análisis y clasificación de riesgo; se determina</text><text x="105" y="952" font-family="Arial" font-size="32" fill="black">diligencia reforzada cuando corresponde.</text><path d="M750,1000 L750,1034" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="1040" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="1086" font-family="Arial" font-size="32" fill="black">7. Se conserva el expediente y se programa actualización por riesgo; la</text><text x="105" y="1122" font-family="Arial" font-size="32" fill="black">salida se recomienda y decide conforme al procedimiento.</text></svg>