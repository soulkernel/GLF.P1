<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 750"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="black"/></marker></defs><rect x="75" y="20" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="66" font-family="Arial" font-size="32" fill="black">1. Usuarios utilizan equipos, conectividad, herramientas de oficina y</text><text x="105" y="102" font-family="Arial" font-size="32" fill="black">repositorios cloud.</text><path d="M750,150 L750,184" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="190" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="236" font-family="Arial" font-size="32" fill="black">2. Se atienden necesidades de acceso y soporte de forma puntual.</text><path d="M750,320 L750,354" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="360" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="406" font-family="Arial" font-size="32" fill="black">3. La información se intercambia mediante correo, Drive y archivos</text><text x="105" y="442" font-family="Arial" font-size="32" fill="black">locales.</text><path d="M750,490 L750,524" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="530" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="576" font-family="Arial" font-size="32" fill="black">4. No se identificó una operación formal centralizada de inventario,</text><text x="105" y="612" font-family="Arial" font-size="32" fill="black">seguridad, respaldos y altas o bajas.</text></svg>