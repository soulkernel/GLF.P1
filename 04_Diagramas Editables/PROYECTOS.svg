<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1430"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="black"/></marker></defs><rect x="75" y="20" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="66" font-family="Arial" font-size="32" fill="black">1. CAT recomienda prioridades y Junta decide la convocatoria.</text><path d="M750,150 L750,184" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="190" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="236" font-family="Arial" font-size="32" fill="black">2. Comunicación publica la convocatoria y coordina orientación.</text><path d="M750,320 L750,354" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="360" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="406" font-family="Arial" font-size="32" fill="black">3. Proponente remite nota conceptual por correo institucional; Programa</text><text x="105" y="442" font-family="Arial" font-size="32" fill="black">revisa cumplimiento administrativo.</text><path d="M750,490 L750,524" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="530" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="576" font-family="Arial" font-size="32" fill="black">4. Se admiten correcciones dentro del plazo de convocatoria; CAT evalúa</text><text x="105" y="612" font-family="Arial" font-size="32" fill="black">y recomienda.</text><path d="M750,660 L750,694" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="700" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="746" font-family="Arial" font-size="32" fill="black">5. Proponentes preseleccionados presentan propuesta completa y</text><text x="105" y="782" font-family="Arial" font-size="32" fill="black">evaluación ambiental y social; Junta decide.</text><path d="M750,830 L750,864" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="870" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="916" font-family="Arial" font-size="32" fill="black">6. Se formalizan convenio y anexos; se gestiona el desembolso inicial</text><text x="105" y="952" font-family="Arial" font-size="32" fill="black">conforme al contrato.</text><path d="M750,1000 L750,1034" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="1040" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="1086" font-family="Arial" font-size="32" fill="black">7. Durante la ejecución, las áreas revisan informes técnicos, de</text><text x="105" y="1122" font-family="Arial" font-size="32" fill="black">salvaguardas y de gestión financiera y solicitan subsanaciones.</text><path d="M750,1170 L750,1204" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="1210" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="1256" font-family="Arial" font-size="32" fill="black">8. Al cierre se consolidan informes finales, revisión legal, destino de</text><text x="105" y="1292" font-family="Arial" font-size="32" fill="black">bienes y acta de finiquito; se confirma la conclusión.</text></svg>