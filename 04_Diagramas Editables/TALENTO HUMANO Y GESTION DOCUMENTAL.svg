<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 750"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="black"/></marker></defs><rect x="75" y="20" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="66" font-family="Arial" font-size="32" fill="black">1. Cada área genera documentos y los conserva en Drive, correo, Excel o</text><text x="105" y="102" font-family="Arial" font-size="32" fill="black">archivo físico.</text><path d="M750,150 L750,184" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="190" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="236" font-family="Arial" font-size="32" fill="black">2. La documentación externa puede recibirse o enviarse por correo y</text><text x="105" y="272" font-family="Arial" font-size="32" fill="black">algunos registros se llevan en Excel.</text><path d="M750,320 L750,354" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="360" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="406" font-family="Arial" font-size="32" fill="black">3. Los accesos y archivo se gestionan de manera distribuida.</text><path d="M750,490 L750,524" stroke="black" fill="none" marker-end="url(#a)"/><rect x="75" y="530" width="1350" height="130" rx="16" fill="#EEF2F4" stroke="black"/><text x="105" y="576" font-family="Arial" font-size="32" fill="black">4. La Dirección Ejecutiva determina ingresos de personal; no se</text><text x="105" y="612" font-family="Arial" font-size="32" fill="black">identificó procedimiento integral de alta, baja, equipos, accesos y</text><text x="105" y="648" font-family="Arial" font-size="32" fill="black">transferencia de archivos.</text></svg>